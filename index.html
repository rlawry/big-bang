<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Bang Quest - Retro Science Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #008080;
            font-family: 'MS Sans Serif', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }

        .window {
            background: linear-gradient(to right, #000080, #1084d7);
            border: 2px solid;
            border-color: #dfdfdf #808080 #808080 #dfdfdf;
            box-shadow: 1px 1px 0 0 #ffffff inset, 2px 2px 0 0 #dfdfdf inset, 1px 1px 0 0 #808080, 2px 2px 0 0 #000000;
            width: 100%;
            max-width: 1000px;
            max-height: 900px;
            min-height: 550px;
            display: flex;
            flex-direction: column;
            transition: max-width 0.1s, max-height 0.1s;
        }

        .window.maximized {
            max-width: 100vw;
            max-height: 100vh;
            width: 100vw;
            height: 100vh;
        }

        body.maximized {
            padding: 0;
            align-items: stretch;
        }

        .title-bar {
            background: linear-gradient(to right, #000080, #1084d7);
            color: white;
            padding: 2px 2px 2px 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .title-bar-controls {
            display: flex;
            gap: 2px;
        }

        .btn-min, .btn-max, .btn-close {
            width: 16px;
            height: 14px;
            background: #c0c0c0;
            border: 1px solid;
            border-color: #dfdfdf #808080 #808080 #dfdfdf;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 10px;
            color: black;
        }

        .btn-min:active, .btn-max:active, .btn-close:active {
            border-color: #808080 #dfdfdf #dfdfdf #808080;
        }

        .menu-bar {
            background-color: #c0c0c0;
            border-bottom: 2px solid;
            border-color: #dfdfdf #808080 #808080 #dfdfdf;
            padding: 2px 2px;
            display: flex;
            gap: 4px;
            height: 22px;
            align-items: center;
            font-size: 11px;
        }

        .menu-item {
            padding: 2px 6px;
            cursor: pointer;
            user-select: none;
        }

        .menu-item:hover {
            background: #000080;
            color: white;
        }

        .main-content {
            background-color: #c0c0c0;
            flex: 1;
            padding: 4px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .game-container {
            flex: 1;
            display: flex;
            gap: 4px;
            overflow: hidden;
        }

        .game-area {
            flex: 1;
            background: linear-gradient(to bottom, #87ceeb 0%, #87ceeb 60%, #90ee90 60%, #90ee90 100%);
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            position: relative;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .sidebar {
            width: 200px;
            background-color: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            padding: 6px;
            overflow-y: auto;
            font-size: 11px;
        }

        .level-list {
            list-style: none;
        }

        .level-item {
            padding: 22px 6px;
            margin-bottom: 2px;
            background-color: #c0c0c0;
            border: 1px solid;
            border-color: #dfdfdf #808080 #808080 #dfdfdf;
            cursor: pointer;
            user-select: none;
        }

        .level-item:hover {
            background: linear-gradient(to bottom, #000080, #1084d7);
            color: white;
        }

        .level-item.active {
            background: linear-gradient(to bottom, #000080, #1084d7);
            color: white;
            border-color: #808080 #dfdfdf #dfdfdf #808080;
        }

        .level-item.completed {
            font-weight: bold;
        }

        .level-item.completed::before {
            content: "✓ ";
            color: green;
        }

        .level-item.locked {
            background-color: #a0a0a0;
            color: #606060;
            cursor: not-allowed;
        }

        .level-item.locked:hover {
            background: #a0a0a0;
            color: #606060;
        }

        .status-bar {
            background-color: #c0c0c0;
            border-top: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            padding: 2px 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 22px;
            font-size: 11px;
        }

        .status-field {
            flex: 1;
            background-color: #c0c0c0;
            border: 2px solid;
            border-color: #808080 #dfdfdf #dfdfdf #808080;
            padding: 2px 4px;
            margin-right: 2px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(to right, #000080, #1084d7);
            border: 2px solid;
            border-color: #dfdfdf #808080 #808080 #dfdfdf;
            box-shadow: 1px 1px 0 0 #ffffff inset, 2px 2px 0 0 #dfdfdf inset, 1px 1px 0 0 #808080, 2px 2px 0 0 #000000;
            width: 400px;
            max-width: 90%;
        }

        .modal-title-bar {
            background: linear-gradient(to right, #000080, #1084d7);
            color: white;
            padding: 2px 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .modal-body {
            background-color: #c0c0c0;
            padding: 12px;
            font-size: 11px;
            color: black;
            max-height: 400px;
            overflow-y: auto;
        }

        .modal-buttons {
            background-color: #c0c0c0;
            padding: 6px;
            display: flex;
            gap: 4px;
            justify-content: flex-end;
            border-top: 1px solid #dfdfdf;
        }

        .btn {
            background-color: #c0c0c0;
            border: 2px solid;
            border-color: #dfdfdf #808080 #808080 #dfdfdf;
            padding: 4px 12px;
            font-size: 11px;
            cursor: pointer;
            font-family: 'MS Sans Serif', Arial, sans-serif;
            user-select: none;
            min-width: 60px;
            text-align: center;
        }

        .btn:active {
            border-color: #808080 #dfdfdf #dfdfdf #808080;
        }

        .btn:hover {
            background: linear-gradient(to bottom, #dfdfdf, #c0c0c0);
        }

        .question-box {
            background-color: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            padding: 8px;
            margin-bottom: 8px;
            font-size: 10px;
        }

        .question-text {
            font-weight: bold;
            margin-bottom: 6px;
            color: #000080;
        }

        .answer-option {
            padding: 4px 4px;
            margin: 4px 0;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
        }

        .answer-option:hover {
            background: linear-gradient(to right, #000080, #1084d7);
            color: white;
        }

        .answer-option input {
            cursor: pointer;
            margin-right: 6px;
            flex-shrink: 0;
        }

        .answer-option label {
            cursor: pointer;
            flex: 1;
        }

        .hud {
            background-color: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            padding: 6px;
            margin-bottom: 4px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hud-item {
            display: flex;
            gap: 8px;
        }

        .hud-label {
            font-weight: bold;
            color: #000080;
        }

        .scrollbar-preview {
            width: 8px;
            height: 100px;
            background: #c0c0c0;
            border: 1px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            position: absolute;
            right: 2px;
            top: 2px;
        }

        .feedback-notification {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 20px;
            border: 2px solid;
            font-weight: bold;
            font-size: 14px;
            z-index: 2000;
            min-width: 200px;
            text-align: center;
            display: none;
        }

        .feedback-notification.show {
            display: block;
            animation: slideUp 0.3s ease-out;
        }

        .feedback-notification.correct {
            background-color: #90ee90;
            border-color: #ffffff #808080 #808080 #ffffff;
            color: #006600;
        }

        .feedback-notification.incorrect {
            background-color: #ffb6b6;
            border-color: #ffffff #808080 #808080 #ffffff;
            color: #8b0000;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
            to {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
        }

        .feedback-notification.fade-out {
            animation: slideDown 0.3s ease-out forwards;
        }
    </style>
</head>
<body>
    <div class="window">
        <div class="title-bar">
            <span>⬜ Big Bang Quest.exe</span>
            <div class="title-bar-controls">
                <div class="btn-min">_</div>
                <div class="btn-max" id="btnMax" onclick="toggleMaximize()">□</div>
                <div class="btn-close">✕</div>
            </div>
        </div>

        <div class="menu-bar">
            <div class="menu-item">File</div>
            <div class="menu-item">Edit</div>
            <div class="menu-item">View</div>
            <div class="menu-item">Help</div>
        </div>

        <div class="main-content">
            <div class="hud">
                <div class="hud-item">
                    <span class="hud-label">Level:</span>
                    <span id="levelDisplay">1</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">Score:</span>
                    <span id="scoreDisplay">0</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">Lives:</span>
                    <span id="livesDisplay">3</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">Progress:</span>
                    <span id="progressDisplay">0%</span>
                </div>
            </div>

            <div class="game-container">
                <div class="game-area" style="position:relative;">
                    <canvas id="gameCanvas"></canvas>
                    <div id="celebrationOverlay" style="
                        display:none; position:absolute; inset:0;
                        align-items:flex-end; justify-content:center;
                        padding-bottom:60px; pointer-events:none;">
                        <div id="celebrationForm" style="
                            pointer-events:auto; text-align:center;
                            background:rgba(0,0,20,0.75);
                            border:2px solid #88ccff;
                            border-radius:8px; padding:14px 24px;">
                            <div style="color:#ffff88;font-size:13px;font-family:'MS Sans Serif',Arial;margin-bottom:8px;letter-spacing:1px;">
                                Enter your name, Space Explorer:
                            </div>
                            <input id="celebrationName" type="text" maxlength="24"
                                onkeydown="if(event.key==='Enter') submitCelebrationName();"
                                style="font-size:14px;padding:4px 10px;border:2px solid #88ccff;
                                       background:#000820;color:#ffffff;border-radius:4px;
                                       font-family:'MS Sans Serif',Arial;width:180px;" />
                            <button onclick="submitCelebrationName()"
                                style="margin-left:8px;padding:4px 14px;font-size:13px;
                                       background:#000080;color:#fff;border:2px solid #88ccff;
                                       border-radius:4px;cursor:pointer;font-family:'MS Sans Serif',Arial;">
                                ✓
                            </button>
                        </div>
                        <div id="celebrationRestart" style="
                            display:none; pointer-events:auto; text-align:center;
                            position:absolute; bottom:18px; right:24px;
                            background:rgba(0,0,20,0.80);
                            border:2px solid #88ccff; border-radius:8px;
                            padding:8px 18px; font-family:'MS Sans Serif',Arial;">
                            <span style="color:#ffff88;font-size:12px;letter-spacing:1px;">
                                Start over?
                            </span>
                            <button onclick="location.reload()"
                                style="margin-left:10px;padding:3px 10px;font-size:12px;
                                       background:#004400;color:#aaffaa;border:2px solid #88ccff;
                                       border-radius:4px;cursor:pointer;font-family:'MS Sans Serif',Arial;">
                                Y
                            </button>
                            <button onclick="document.getElementById('celebrationRestart').style.display='none'"
                                style="margin-left:4px;padding:3px 10px;font-size:12px;
                                       background:#440000;color:#ffaaaa;border:2px solid #88ccff;
                                       border-radius:4px;cursor:pointer;font-family:'MS Sans Serif',Arial;">
                                N
                            </button>
                        </div>
                    </div>
                </div>

                <div class="sidebar">
                    <h4 style="color: #000080; margin-bottom: 8px; font-size: 12px;">LEVELS</h4>
                    <ul class="level-list">
                        <li class="level-item active" data-level="1">1. Definitions</li>
                        <li class="level-item" data-level="2">2. Facts</li>
                        <li class="level-item" data-level="3">3. Redshift</li>
                        <li class="level-item" data-level="4">4. Galaxy Movement</li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="status-bar">
            <div class="status-field">Ready</div>
        </div>
    </div>

    <!-- Question Modal -->
    <div class="modal" id="questionModal">
        <div class="modal-content">
            <div class="modal-title-bar">
                <span id="questionTitle">Question</span>
                <span style="cursor: pointer;" onclick="closeModal()">✕</span>
            </div>
            <div class="modal-body" id="questionBody"></div>
            <div class="modal-buttons">
                <button class="btn" onclick="submitAnswer()">SUBMIT</button>
            </div>
        </div>
    </div>

    <!-- Level Complete Modal -->
    <div class="modal" id="levelCompleteModal">
        <div class="modal-content">
            <div class="modal-title-bar">
                <span>Level Complete!</span>
                <span style="cursor: pointer;" onclick="closeLevelModal()">✕</span>
            </div>
            <div class="modal-body">
                <p style="margin-bottom: 12px;">Great job! You've completed this level.</p>
                <p id="levelReward" style="color: #008000; font-weight: bold;"></p>
            </div>
            <div class="modal-buttons">
                <button class="btn" onclick="nextLevel()">Next Level</button>
            </div>
        </div>
    </div>



    <!-- Feedback Notification -->
    <div class="feedback-notification" id="feedbackNotification"></div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let gameState = {
            currentLevel: 1,
            score: 0,
            lives: 3,
            playerX: 50,
            playerY: 0,
            levelProgress: 0,
            questionsAnswered: 0,
            questionsCorrect: 0,
            playerVelX: 0,
            playerVelY: 0,
            playerDirection: 1, // 1 for right, -1 for left
            playerAnimFrame: 0,
            cameraX: 0,
            cameraY: 0,
            inExploration: false,
            currentFact: null,
            factPaperX: 0,
            factPaperY: 0,
            factDudeX: 0,
            factDudeY: 0,
            factDudeFound: false,
            paperFound: false,
            // Space dog battle
            dogSpawned: false,
            dogX: 0,
            dogY: 0,
            inBattle: false,
            activeBattleEnemy: 'dog',
            dogHealth: 3,
            dogMaxHealth: 3,
            // Space kitty (galaxy mode)
            kittySpawned: false,
            kittyX: 0,
            kittyY: 0,
            playerBattleHealth: 5,
            playerMaxBattleHealth: 5,
            battleTurn: 'player',
            battleAnimating: false,
            battleProjectile: null,
            currentBattleFact: null,
            battleDogFactDeck: [],
            battleKittyFactDeck: [],
            battleWaiting: false,
            inGalaxyMode: false,
            galaxyData: null,
            inRedshiftMode: false,
            redshiftData: { galaxies: [], lockedGalaxy: null, spectrumAnim: 0 },
            inCelebration: false,
            celebrationPhase: 0,
            celebrationFrame: 0,
            celebrationName: '',
            celebrationDudes: [],
            celebrationDogs: [],
            celebrationKitties: []
        };

        let keyPressed = {};

        const bgMusic = new Audio('background.mp3');
        bgMusic.loop = true;
        bgMusic.volume = 0.5;
        let bgMusicStarted = false;

        function ensureMusicPlaying() {
            if (!bgMusicStarted) {
                bgMusicStarted = true;
                bgMusic.play().catch(() => {});
            }
        }

        const PLAYER_SPEED = 4;
        const PLAYER_WIDTH = 20;
        const PLAYER_HEIGHT = 30;
        const LEVEL_WIDTH = 3000; // Extended world size
        const SCREEN_WIDTH_UNITS = 800; // Absolute screen width in game units
        let flags = [];
        let currentFlagIndex = 0;

        // Level data with Big Bang content
        const levels = {
            1: {
                title: "Definitions",
                questions: [
                    {
                        question: "What is the Big Bang?",
                        options: [
                            "The explosion of a star",
                            "The theory that the universe began as a hot, dense point and has been expanding",
                            "A type of supernova",
                            "The collision of galaxies"
                        ],
                        correct: 1
                    },
                    {
                        question: "What is a parsec?",
                        options: [
                            "A unit of mass",
                            "A unit of time",
                            "A unit of distance used in astronomy",
                            "A type of telescope"
                        ],
                        correct: 2
                    },
                    {
                        question: "Define redshift:",
                        options: [
                            "The brightening of light from distant objects",
                            "The shifting of light toward the blue end of the spectrum",
                            "The shifting of light toward the red end of the spectrum",
                            "A type of star"
                        ],
                        correct: 2
                    },
                    {
                        question: "What is a light-year?",
                        options: [
                            "The distance light travels in one year",
                            "A unit of time in space",
                            "The brightness of a star",
                            "The age of a star"
                        ],
                        correct: 0
                    },
                    {
                        question: "What is a galaxy?",
                        options: [
                            "A single star system",
                            "A massive collection of stars, gas, and dust held together by gravity",
                            "A type of nebula",
                            "An asteroid belt"
                        ],
                        correct: 1
                    },
                    {
                        question: "Define a supernova:",
                        options: [
                            "A dim, fading star",
                            "A small star near Earth",
                            "The explosive death of a star",
                            "A newly formed star"
                        ],
                        correct: 2
                    },
                    {
                        question: "What is dark matter?",
                        options: [
                            "Burned-out stars",
                            "Matter that does not emit light but exerts gravitational effects",
                            "Black holes and neutron stars",
                            "Dust clouds in space"
                        ],
                        correct: 1
                    },
                    {
                        question: "What is dark energy?",
                        options: [
                            "Energy from dying stars",
                            "The mysterious force causing the universe's accelerated expansion",
                            "Energy inside black holes",
                            "Radiation from the sun"
                        ],
                        correct: 1
                    }
                ]
            },
            2: {
                title: "Facts",
                questions: [
                    {
                        question: "The universe is approximately how old?",
                        options: [
                            "4.6 billion years",
                            "13.8 billion years",
                            "100 billion years",
                            "1 million years"
                        ],
                        correct: 1
                    },
                    {
                        question: "What percentage of the universe is dark matter?",
                        options: [
                            "5%",
                            "27%",
                            "50%",
                            "73%"
                        ],
                        correct: 1
                    },
                    {
                        question: "The universe is expanding. True or False?",
                        options: [
                            "True",
                            "False"
                        ],
                        correct: 0
                    }
                ]
            },
            3: {
                title: "Redshift",
                questions: [
                    {
                        question: "What is redshift?",
                        options: [
                            "The brightening of starlight as it travels through space",
                            "The stretching of light wavelengths toward the red end of the spectrum as a source moves away",
                            "The absorption of blue light by interstellar dust",
                            "The cooling of a star's surface over time"
                        ],
                        correct: 1
                    },
                    {
                        question: "What physical phenomenon explains the redshift of light from distant galaxies?",
                        options: [
                            "Gravitational lensing bending light around massive objects",
                            "The Doppler effect — wavelengths stretch when a source moves away",
                            "Nuclear fusion releasing energy at longer wavelengths",
                            "Reflection of light off cosmic dust clouds"
                        ],
                        correct: 1
                    },
                    {
                        question: "How do astronomers detect redshift in a galaxy's light?",
                        options: [
                            "By measuring how bright the galaxy appears",
                            "By comparing the galaxy's spectrum to known spectral lines shifted toward longer wavelengths",
                            "By counting the number of stars visible",
                            "By timing how long the galaxy takes to orbit the Milky Way"
                        ],
                        correct: 1
                    },
                    {
                        question: "Hubble's Law (v = H₀ × d) states that a galaxy's recession speed:",
                        options: [
                            "Is the same for all galaxies regardless of distance",
                            "Decreases as distance increases",
                            "Is proportional to its distance from the observer",
                            "Depends on the galaxy's mass, not its distance"
                        ],
                        correct: 2
                    },
                    {
                        question: "A galaxy at twice the distance of another galaxy will have a recession speed that is:",
                        options: [
                            "The same",

                            "Half as great",

                        ],
                        correct: 3
                    },
                    {
                        question: "The fact that nearly all galaxies show redshift (not blueshift) is evidence that:",
                        options: [
                            "All galaxies are rotating in the same direction",
                            "The universe is expanding — most galaxies are moving away from us",
                            "Light loses energy as it crosses empty space",
                            "Only nearby galaxies are visible to telescopes"
                        ],
                        correct: 1
                    },
                    {
                        question: "Which of the following would produce a blueshift instead of a redshift?",
                        options: [
                            "A galaxy moving away at high speed",
                            "A galaxy at rest relative to Earth",
                            "The Andromeda Galaxy moving toward the Milky Way",
                            "A galaxy billions of light-years away"
                        ],
                        correct: 2
                    }
                ]
            },
            4: {
                title: "Galaxy Movement (Redshift)",
                questions: [
                    {
                        question: "What causes the observed redshift in distant galaxies?",
                        options: [
                            "Galaxies moving away from us (expansion of space)",
                            "Dust between us and the galaxies",
                            "Gravitational lensing",
                            "The Doppler effect from stars moving toward us"
                        ],
                        correct: 0
                    },
                    {
                        question: "Edwin Hubble's discovery showed that:",
                        options: [
                            "The universe is contracting",
                            "The universe is static",
                            "The universe is expanding",
                            "Galaxies orbit around us"
                        ],
                        correct: 2
                    },
                    {
                        question: "What does Hubble's Law (v = H₀ × d) state?",

        function shuffleQuestionOptions(question) {
            const indices = question.options.map((_, i) => i);
            for (let i = indices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [indices[i], indices[j]] = [indices[j], indices[i]];
            }
            return {
                ...question,
                options: indices.map(i => question.options[i]),
                correct: indices.indexOf(question.correct)
            };
        }

        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function resizeCanvas() {

        function drawGame() {
            if (gameState.inCelebration) {
                drawCelebration();
                return;
            }

            if (gameState.inBattle) {
                drawBattleMode();
                return;
            }

            if (gameState.inExploration || gameState.inGalaxyMode || gameState.inRedshiftMode) {
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {
                // Draw sky and ground
                ctx.fillStyle = '#87ceeb';
                ctx.fillRect(0, 0, canvas.width, canvas.height * 0.6);

                ctx.fillStyle = '#90ee90';
                ctx.fillRect(0, canvas.height * 0.6, canvas.width, canvas.height * 0.4);
            }

            if (gameState.inRedshiftMode) {
                drawRedshiftContent();
            } else if (gameState.inGalaxyMode) {
                drawGalaxyContent();
            } else if (gameState.inExploration) {
                drawExplorationContent();
            } else {
                drawLevelContent();
            }

            // Draw player - camera offset applies in all non-battle modes
            const screenPlayerX = gameState.playerX - gameState.cameraX;
            const screenPlayerY = (gameState.inExploration || gameState.inGalaxyMode || gameState.inRedshiftMode) ? gameState.playerY - gameState.cameraY
                : gameState.playerY;
            const eyeLeftX = gameState.playerDirection === 1 ? 4 : 12;
            const eyeRightX = gameState.playerDirection === 1 ? 12 : 4;
            const smileX = gameState.playerDirection === 1 ? 5 : 10;
            const leg1X = gameState.playerDirection === 1 ? 5 : 12;
            const leg2X = gameState.playerDirection === 1 ? 12 : 5;

            // Draw body
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(screenPlayerX, screenPlayerY, PLAYER_WIDTH, PLAYER_HEIGHT);

            // Draw eyes
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(screenPlayerX + eyeLeftX, screenPlayerY + 6, 4, 4);
            ctx.fillRect(screenPlayerX + eyeRightX, screenPlayerY + 6, 4, 4);

            // Draw pupils
            ctx.fillStyle = '#000000';
            ctx.fillRect(screenPlayerX + eyeLeftX + 1, screenPlayerY + 7, 2, 2);
            ctx.fillRect(screenPlayerX + eyeRightX + 1, screenPlayerY + 7, 2, 2);

        function drawTree(worldX, screenX, height) {
            const treeBaseY = canvas.height * 0.65;

            if (screenX < -50 || screenX > canvas.width + 50) return;

            // Trunk
            ctx.fillStyle = '#654321';
            ctx.fillRect(screenX - 5, treeBaseY - height, 10, height);

            // How many of the 3 clusters have become galaxies
            const totalQ = levels[1].questions.length;
            const galaxyCount = Math.min(3, Math.floor((gameState.questionsAnswered / totalQ) * 3 + 0.001));

            const rng = s => Math.abs(Math.sin(s * 9301 + 49297) * 233280) % 1;
            const baseRot = rng(worldX * 0.01) * Math.PI * 2;
            const pulse = gameState.playerAnimFrame * 0.06;
            const galaxyColors = ['#aaccff', '#ccddff', '#ddccff'];

            // [dx, dy, radius] for each cluster
            const clusters = [
                [0,  -15, 20],
                [-12, -5, 15],
                [12,  -5, 15],
            ];

            clusters.forEach(([dx, dy, r], i) => {
                const cx = screenX + dx;
                const cy = treeBaseY - height + dy;
                if (i < galaxyCount) {
                    drawSpiralGalaxy(cx, cy, r * 0.85, baseRot + i * 1.2, galaxyColors[i % galaxyColors.length], false, pulse);
                } else {
                    ctx.fillStyle = '#228b22';
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        function drawEnemy(screenX, screenY, defeated, enemyType, isFalling, rotation, opacity) {
            // Only draw if visible
            if (screenX < -50 || screenX > canvas.width + 50) return;

            // Skip drawing if fully faded
            if (opacity <= 0) return;

            // Bob animation when standing idle — each enemy has a different phase
            if (!isFalling && !defeated) {
                screenY += Math.sin(gameState.playerAnimFrame * 0.05 + enemyType * 1.3) * 4;
            }

            // Save canvas state for rotation and opacity
            ctx.save();
            ctx.globalAlpha = opacity;

            if (isFalling && rotation !== 0) {
                ctx.translate(screenX, screenY);
                ctx.rotate(rotation);
                ctx.translate(-screenX, -screenY);
            }

            // Color based on defeated status and falling state
            let bodyColor = defeated ? '#90ee90' : ['#ff00ff', '#00ffff', '#ffff00', '#ff6b6b'][enemyType % 4];
            if (isFalling) {
                bodyColor = '#ff0000'; // Turn red when falling/attacking
            }

            // Body - irregular shape for funky look
            ctx.fillStyle = bodyColor;
            ctx.fillRect(screenX - 12, screenY - 30, 24, 35);

            // Head - wobby circle
            ctx.beginPath();
            ctx.arc(screenX, screenY - 35, 10, 0, Math.PI * 2);
            ctx.fill();

            // Eyes - googly and wild
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(screenX - 4, screenY - 37, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(screenX + 5, screenY - 36, 3.5, 0, Math.PI * 2);

            ctx.beginPath();
            ctx.arc(screenX - 3, screenY - 38, 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(screenX + 6, screenY - 35, 1.5, 0, Math.PI * 2);
            ctx.fill();

            // Mouth - wavy line
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(screenX - 3, screenY - 32);
            ctx.quadraticCurveTo(screenX, screenY - 30, screenX + 3, screenY - 32);

            // Weird arms - different lengths

            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(screenX - 12, screenY - 15);
            ctx.lineTo(screenX - 25, screenY - 10);

            ctx.stroke();

            // Spiky hair
            ctx.fillStyle = bodyColor;
            for (let i = 0; i < 5; i++) {

        }

        function drawExplorationContent() {
            // Draw starfield
            drawStarfield();

            // Draw paper
            const paperScreenX = gameState.factPaperX - gameState.cameraX;
            const paperScreenY = gameState.factPaperY - gameState.cameraY;

            // Check if paper is on screen
            const paperOnScreen = paperScreenX > -50 && paperScreenX < canvas.width + 50 &&
                                  paperScreenY > -50 && paperScreenY < canvas.height + 50;

            if (paperOnScreen) {
                // Draw paper sprite
                ctx.save();
                ctx.globalAlpha = gameState.explorationOpacity || 1;
                ctx.fillStyle = '#ffffcc';
                ctx.fillRect(paperScreenX - 15, paperScreenY - 25, 30, 50);
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 2;
                ctx.strokeRect(paperScreenX - 15, paperScreenY - 25, 30, 50);

                // Draw lines on paper to look like text
                ctx.strokeStyle = '#333333';
                ctx.lineWidth = 1;
                for (let i = 0; i < 4; i++) {
                    ctx.beginPath();
                    ctx.moveTo(paperScreenX - 12, paperScreenY - 20 + i * 8);
                    ctx.lineTo(paperScreenX + 12, paperScreenY - 20 + i * 8);
                    ctx.stroke();
                }

                // Glow effect if not found
                if (!gameState.paperFound) {
                    ctx.strokeStyle = '#ffff00';
                    ctx.lineWidth = 3;
                    ctx.globalAlpha = (gameState.explorationOpacity || 1) * 0.5;
                    ctx.strokeRect(paperScreenX - 20, paperScreenY - 30, 40, 60);
                }
                ctx.restore();
            } else if (!gameState.paperFound) {
                // Draw arrow pointing to off-screen paper
                drawDirectionalArrow(gameState.factPaperX, gameState.factPaperY, '#ffff00');
            }

            // Draw fact dude if paper is found
            if (gameState.paperFound) {
                const dudeScreenX = gameState.factDudeX - gameState.cameraX;
                const dudeScreenY = gameState.factDudeY - gameState.cameraY;

                const dudeOnScreen = dudeScreenX > -50 && dudeScreenX < canvas.width + 50 &&
                                     dudeScreenY > -50 && dudeScreenY < canvas.height + 50;

                if (dudeOnScreen) {
                    drawEnemy(dudeScreenX, dudeScreenY, false, 0, false, 0, gameState.explorationOpacity || 1);
                } else if (!gameState.factDudeFound) {
                    // Draw arrow pointing to off-screen dude
                    drawDirectionalArrow(gameState.factDudeX, gameState.factDudeY, '#ff00ff');
                }
            }

            // Draw space dog if spawned
            if (gameState.dogSpawned && !gameState.inBattle) {
                const dogScreenX = gameState.dogX - gameState.cameraX;
                const dogScreenY = gameState.dogY - gameState.cameraY;
                const dogOnScreen = dogScreenX > -80 && dogScreenX < canvas.width + 80 &&
                                    dogScreenY > -80 && dogScreenY < canvas.height + 80;
                if (dogOnScreen) {
                    drawSpaceDog(dogScreenX, dogScreenY, 1);
                } else {
                    drawDirectionalArrow(gameState.dogX, gameState.dogY, '#ff4400');
                }
            }

            // Draw distance indicators and info
            ctx.fillStyle = '#ffffff';
            ctx.font = '11px Arial';
            ctx.textAlign = 'left';

            // Facts progress
            const factsAnswered = gameState.factsAnswered || 0;
            ctx.fillStyle = '#ffff99';
            ctx.font = 'bold 12px Arial';
            ctx.fillText(`Facts Discovered: ${factsAnswered}/6`, 10, 30);
        }

        function drawDirectionalArrow(targetX, targetY, color) {
            // Calculate direction to target
            const dx = targetX - gameState.playerX;
            const dy = targetY - gameState.playerY;
            const angle = Math.atan2(dy, dx);

            // Calculate arrow position on screen edge
            const padding = 20;
            let arrowX, arrowY;
            let onEdge = null;

            const screenCenterX = canvas.width / 2;
            const screenCenterY = canvas.height / 2;

            // Determine which edge the target is beyond
            const slope = dy / (dx || 0.001);

            if (Math.abs(dx) > Math.abs(dy)) {
                // Target is more left/right than up/down
                if (dx > 0) {
                    // Right edge
                    arrowX = canvas.width - padding;
                    arrowY = screenCenterY + slope * (canvas.width / 2 - padding);
                    onEdge = 'right';
                } else {
                    // Left edge
                    arrowX = padding;
                    arrowY = screenCenterY - slope * (canvas.width / 2 - padding);
                    onEdge = 'left';
                }
            } else {
                // Target is more up/down than left/right
                if (dy > 0) {
                    // Bottom edge
                    arrowY = canvas.height - padding;
                    arrowX = screenCenterX + (canvas.height / 2 - padding) / slope;
                    onEdge = 'bottom';
                } else {
                    // Top edge
                    arrowY = padding;
                    arrowX = screenCenterX - (canvas.height / 2 - padding) / slope;
                    onEdge = 'top';
                }
            }

            // Clamp to screen corners
            arrowX = Math.max(padding, Math.min(canvas.width - padding, arrowX));
            arrowY = Math.max(padding, Math.min(canvas.height - padding, arrowY));

            // Draw arrow
            ctx.save();
            ctx.fillStyle = color;
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;

            // Translate to arrow position
            ctx.translate(arrowX, arrowY);
            ctx.rotate(angle);

            // Draw arrow head
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-12, -8);
            ctx.lineTo(-12, 8);
            ctx.closePath();
            ctx.fill();

            // Draw arrow shaft
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-15, 0);
            ctx.stroke();

            ctx.restore();
        }

        function drawStarfield() {
            // Draw stars based on player position for parallax effect
            const starDensity = 0.0001; // Stars per square unit
            const starSize = 1;

            ctx.fillStyle = '#ffffff';
            ctx.globalAlpha = 0.8;

            // Generate stars in grid cells around the camera
            const cellSize = 100;
            const startCellX = Math.floor((gameState.cameraX - canvas.width) / cellSize);
            const startCellY = Math.floor((gameState.cameraY - canvas.height) / cellSize);
            const endCellX = Math.floor((gameState.cameraX + canvas.width * 2) / cellSize);
            const endCellY = Math.floor((gameState.cameraY + canvas.height * 2) / cellSize);

            for (let cellX = startCellX; cellX <= endCellX; cellX++) {
                for (let cellY = startCellY; cellY <= endCellY; cellY++) {
                    // Use cell coordinates as seed for consistent star positions
                    const seed = cellX * 73856093 ^ cellY * 19349663;
                    const random = Math.abs(Math.sin(seed) * 10000) % 1;

                    // Place stars using seeded randomness
                    const starsInCell = Math.floor(starDensity * cellSize * cellSize);
                    for (let i = 0; i < starsInCell; i++) {
                        const starSeed = seed + i * 12345;
                        const starX = cellX * cellSize + (Math.sin(starSeed) * cellSize / 2 + cellSize / 2);
                        const starY = cellY * cellSize + (Math.cos(starSeed * 2) * cellSize / 2 + cellSize / 2);

                        const screenX = starX - gameState.cameraX;
                        const screenY = starY - gameState.cameraY;

                        if (screenX > 0 && screenX < canvas.width && screenY > 0 && screenY < canvas.height) {
                            ctx.fillRect(screenX, screenY, starSize, starSize);
                        }
                    }
                }
            }

            ctx.globalAlpha = 1;
        }

        // ---- SPACE DOG SPRITE ----
        function drawSpaceDog(x, y, opacity) {
            ctx.save();
            ctx.globalAlpha = opacity;

            // Body
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(x - 20, y - 25, 40, 30);

            // Head
            ctx.fillStyle = '#A0522D';
            ctx.beginPath();
            ctx.arc(x, y - 35, 18, 0, Math.PI * 2);
            ctx.fill();

            // Space helmet (glass dome)
            ctx.strokeStyle = '#88ccff';
            ctx.lineWidth = 3;
            ctx.globalAlpha = opacity * 0.5;
            ctx.beginPath();
            ctx.arc(x, y - 35, 20, 0, Math.PI * 2);
            ctx.stroke();
            ctx.globalAlpha = opacity;

            // Eyes (googly)
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(x - 7, y - 37, 5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + 7, y - 37, 5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#000000';
            ctx.beginPath(); ctx.arc(x - 6, y - 37, 2.5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + 8, y - 36, 2.5, 0, Math.PI * 2); ctx.fill();

            // Snout
            ctx.fillStyle = '#c97040';
            ctx.fillRect(x - 8, y - 30, 16, 10);
            ctx.fillStyle = '#000000';
            ctx.fillRect(x - 4, y - 28, 8, 4); // nose

            // Ears (floppy)
            ctx.fillStyle = '#8B4513';
            ctx.beginPath();
            ctx.ellipse(x - 18, y - 42, 7, 14, -0.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(x + 18, y - 42, 7, 14, 0.4, 0, Math.PI * 2);
            ctx.fill();

            // Legs
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(x - 18, y + 5, 8, 14);
            ctx.fillRect(x + 10, y + 5, 8, 14);

            // Tail (wagging)
            const wag = Math.sin(gameState.playerAnimFrame * 0.15) * 10;
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(x + 20, y - 5);
            ctx.quadraticCurveTo(x + 35, y - 15 + wag, x + 40, y - 25 + wag);
            ctx.stroke();

            // Space helmet ring — front arc only, so it appears to wrap behind the head
            ctx.strokeStyle = '#aaaaaa';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(x, y - 18, 18, 5, 0, 0.15, Math.PI - 0.15);
            ctx.stroke();

            ctx.restore();
        }

        // ---- SPACE KITTY SPRITE ----
        function drawSpaceKitty(x, y, opacity) {
            ctx.save();
            ctx.globalAlpha = opacity;

            // Body
            ctx.fillStyle = '#888888';
            ctx.fillRect(x - 18, y - 22, 36, 28);

            // Head
            ctx.fillStyle = '#aaaaaa';
            ctx.beginPath();
            ctx.arc(x, y - 32, 16, 0, Math.PI * 2);
            ctx.fill();

            // Pointy ears
            ctx.fillStyle = '#aaaaaa';
            ctx.beginPath();
            ctx.moveTo(x - 14, y - 44);
            ctx.lineTo(x - 20, y - 60);
            ctx.lineTo(x - 5,  y - 46);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x + 14, y - 44);
            ctx.lineTo(x + 20, y - 60);
            ctx.lineTo(x + 5,  y - 46);
            ctx.closePath();
            ctx.fill();

            // Inner ear
            ctx.fillStyle = '#ffaacc';
            ctx.beginPath();
            ctx.moveTo(x - 13, y - 46);
            ctx.lineTo(x - 18, y - 57);
            ctx.lineTo(x - 7,  y - 47);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x + 13, y - 46);
            ctx.lineTo(x + 18, y - 57);
            ctx.lineTo(x + 7,  y - 47);
            ctx.closePath();
            ctx.fill();

            // Space helmet dome
            ctx.strokeStyle = '#88ccff';
            ctx.lineWidth = 3;
            ctx.globalAlpha = opacity * 0.5;
            ctx.beginPath();
            ctx.arc(x, y - 32, 20, 0, Math.PI * 2);
            ctx.stroke();
            ctx.globalAlpha = opacity;

            // Eyes (slit pupils)
            ctx.fillStyle = '#55ff88';
            ctx.beginPath(); ctx.ellipse(x - 6, y - 34, 4, 5, 0, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(x + 6, y - 34, 4, 5, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#000000';
            ctx.beginPath(); ctx.ellipse(x - 6, y - 34, 1.2, 4, 0, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(x + 6, y - 34, 1.2, 4, 0, 0, Math.PI * 2); ctx.fill();

            // Nose
            ctx.fillStyle = '#ff99bb';
            ctx.beginPath();
            ctx.moveTo(x, y - 27);
            ctx.lineTo(x - 3, y - 23);
            ctx.lineTo(x + 3, y - 23);
            ctx.closePath();
            ctx.fill();

            // Whiskers
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1;
            ctx.globalAlpha = opacity * 0.8;
            [[-1, 1], [-1, 0], [1, 1], [1, 0]].forEach(([side, row]) => {
                ctx.beginPath();
                ctx.moveTo(x + side * 4, y - 25 + row * 3);
                ctx.lineTo(x + side * 22, y - 26 + row * 4);
                ctx.stroke();
            });
            ctx.globalAlpha = opacity;

            // Helmet collar ring — front arc only
            ctx.strokeStyle = '#aaaaaa';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(x, y - 14, 16, 5, 0, 0.15, Math.PI - 0.15);
            ctx.stroke();

            // Legs
            ctx.fillStyle = '#888888';
            ctx.fillRect(x - 16, y + 6, 7, 12);
            ctx.fillRect(x + 9,  y + 6, 7, 12);

            // Tail (swishing)
            const swish = Math.sin(gameState.playerAnimFrame * 0.18) * 14;
            ctx.strokeStyle = '#888888';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(x - 18, y);
            ctx.quadraticCurveTo(x - 38, y - 10 + swish, x - 44, y - 28 + swish);
            ctx.stroke();
            // tail tip curl
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(x - 44, y - 30 + swish, 5, 0, Math.PI * 1.5);
            ctx.stroke();

            ctx.restore();
        }

        // ---- BATTLE MODE ----
        function enterBattle(enemy = 'dog') {
            gameState.inBattle = true;
            gameState.activeBattleEnemy = enemy;
            gameState.dogHealth = gameState.dogMaxHealth;
            gameState.playerBattleHealth = gameState.playerMaxBattleHealth;
            gameState.battleTurn = 'player';
            gameState.battleAnimating = false;
            gameState.battleProjectile = null;
            gameState.battleWaiting = false;
            gameState.currentBattleFact = null;
            gameState.battleDogFactDeck = shuffleArray(dogBattleFacts);
            gameState.battleKittyFactDeck = shuffleArray(kittyBattleFacts);

            // Pause all movement
            Object.keys(keyPressed).forEach(k => keyPressed[k] = false);
        }

        function exitBattle() {
            gameState.inBattle = false;
            gameState.dogSpawned = false;
            gameState.kittySpawned = false;
            gameState.battleProjectile = null;
            gameState.currentBattleFact = null;
            gameState.battleWaiting = false;
        }

        function drawBattleMode() {
            const W = canvas.width;
            const H = canvas.height;
            const midY = H / 2;

            // Starfield background
            ctx.fillStyle = '#000011';
            ctx.fillRect(0, 0, W, H);
            drawStarfield();

            // Dividing line
            ctx.strokeStyle = '#333366';
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 6]);
            ctx.beginPath();
            ctx.moveTo(W / 2, 0);
            ctx.lineTo(W / 2, H);
            ctx.stroke();
            ctx.setLineDash([]);

            // Health bars - enemy left, player right
            const enemyLabel = gameState.activeBattleEnemy === 'kitty' ? 'SPACE KITTY' : 'SPACE DOG';
            drawBattleHealthBar(20, 10, 160, 16, gameState.dogHealth, gameState.dogMaxHealth, '#cc3300', enemyLabel);
            drawBattleHealthBar(W - 180, 10, 160, 16, gameState.playerBattleHealth, gameState.playerMaxBattleHealth, '#00cc00', 'YOU');

            // Draw enemy sprite (left quarter)
            if (gameState.activeBattleEnemy === 'kitty') {
                drawSpaceKitty(W / 4, midY, 1);
            } else {
                drawSpaceDog(W / 4, midY, 1);
            }

            // Draw player (right quarter)
            const px = W * 3 / 4;
            const py = midY - 15;
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(px - 10, py, 20, 30);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(px - 6, py + 6, 4, 4);
            ctx.fillRect(px + 2, py + 6, 4, 4);
            ctx.fillStyle = '#000000';
            ctx.fillRect(px - 5, py + 7, 2, 2);
            ctx.fillRect(px + 3, py + 7, 2, 2);
            ctx.fillRect(px - 5, py + 15, 10, 2);
            ctx.fillStyle = '#0066cc';
            ctx.fillRect(px - 5, py + 28, 3, 4);
            ctx.fillRect(px + 2, py + 28, 3, 4);

            // Projectile animation - text scrolls from right side through the dog
            if (gameState.battleProjectile) {
                const p = gameState.battleProjectile;
                p.x += p.velX;

                // Draw as a single scrolling line of text
                ctx.save();
                ctx.fillStyle = p.color;
                ctx.font = 'bold 11px Arial';
                ctx.textAlign = 'left';
                ctx.fillText(p.text, p.x, p.y);
                ctx.restore();

                // Deal damage when the leading edge of the text reaches the dog
                if (!p.damageDone && p.x <= W / 4) {
                    p.damageDone = true;
                    gameState.dogHealth = Math.max(0, gameState.dogHealth - 1);
                    if (gameState.dogHealth <= 0) {
                        gameState.battleProjectile = null;
                        gameState.battleAnimating = false;
                        setTimeout(() => {
                            showFeedback('Space Dog defeated! Back to exploring!', true);
                            exitBattle();
                        }, 600);
                        return;
                    }
                    // Enemy's turn after a short delay
                    setTimeout(() => {
                        if (gameState.activeBattleEnemy === 'kitty') {
                            if (gameState.battleKittyFactDeck.length === 0) {
                                gameState.battleKittyFactDeck = shuffleArray(kittyBattleFacts);
                            }
                            gameState.currentBattleFact = gameState.battleKittyFactDeck.pop();
                        } else {
                            if (gameState.battleDogFactDeck.length === 0) {
                                gameState.battleDogFactDeck = shuffleArray(dogBattleFacts);
                            }
                            gameState.currentBattleFact = gameState.battleDogFactDeck.pop();
                        }
                        gameState.battleTurn = 'dog';
                        gameState.battleAnimating = false;
                        gameState.battleWaiting = true;
                    }, 400);
                }

                // Remove projectile once the full text has scrolled off the left edge
                if (p.x + p.textWidth <= 0) {
                    gameState.battleProjectile = null;
                }
            }

            // Battle UI
            ctx.textAlign = 'center';
            if (gameState.battleTurn === 'player' && !gameState.battleAnimating) {
                ctx.fillStyle = '#ffff00';
                ctx.font = 'bold 13px Arial';
                ctx.fillText('YOUR TURN - Press SPACE to fire a fact!', W / 2, H - 30);
            } else if (gameState.battleTurn === 'dog' && gameState.battleWaiting && gameState.currentBattleFact) {
                // Draw dog's attack fact
                ctx.fillStyle = '#ff8800';
                ctx.font = 'bold 11px Arial';
                ctx.fillText('SPACE DOG FIRES A FACT!', W / 2, H - 90);

                ctx.fillStyle = '#ffffff';
                ctx.font = '11px Arial';
                const words = gameState.currentBattleFact.statement.split(' ');
                let line = '', lineY = H - 72;
                words.forEach((word, i) => {
                    const test = line + word + ' ';
                    if (ctx.measureText(test).width > W - 60 && i > 0) {
                        ctx.fillText(line, W / 2, lineY);
                        line = word + ' ';
                        lineY += 14;
                    } else { line = test; }
                });
                ctx.fillText(line, W / 2, lineY);

                ctx.fillStyle = '#00ff88';
                ctx.font = 'bold 12px Arial';
                ctx.fillText('TRUE or FALSE?  Press T or F', W / 2, H - 12);
            } else if (gameState.battleAnimating) {
                ctx.fillStyle = '#aaaaaa';
                ctx.font = '11px Arial';
                ctx.fillText('...', W / 2, H - 30);
            }
        }

        function drawBattleHealthBar(x, y, w, h, current, max, color, label) {
            ctx.fillStyle = '#333333';
            ctx.fillRect(x, y, w, h);
            const fill = (current / max) * w;
            ctx.fillStyle = color;
            ctx.fillRect(x, y, fill, h);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1;
            ctx.strokeRect(x, y, w, h);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 9px Arial';
            ctx.textAlign = 'left';
            ctx.fillText(`${label}: ${current}/${max}`, x, y - 2);
        }

        function playerBattleAttack() {
            if (!gameState.inBattle || gameState.battleTurn !== 'player' || gameState.battleAnimating) return;
            gameState.battleAnimating = true;

            const factText = gameState.activeFact ? gameState.activeFact.fact : 'A Big Bang fact!';
            ctx.font = 'bold 11px Arial';
            const textWidth = ctx.measureText(factText).width;
            gameState.battleProjectile = {
                x: canvas.width + 10,  // start fully off-screen right
                y: canvas.height / 2,
                velX: -1.5,            // slow leftward scroll
                text: factText,
                color: '#00ffff',
                textWidth: textWidth,
                damageDone: false
            };
            gameState.battleTurn = 'waiting';
        }

        function resolveDogAttack(playerAnsweredTrue) {
            if (!gameState.inBattle || !gameState.battleWaiting || !gameState.currentBattleFact) return;
            const correct = playerAnsweredTrue === gameState.currentBattleFact.isTrue;
            gameState.battleWaiting = false;

            if (!correct) {
                gameState.playerBattleHealth = Math.max(0, gameState.playerBattleHealth - 1);
                showFeedback(`Wrong! It was ${gameState.currentBattleFact.isTrue ? 'TRUE' : 'FALSE'}`, false);

                if (gameState.playerBattleHealth <= 0) {
                    setTimeout(() => {
                        gameState.lives = Math.max(0, gameState.lives - 1);
                        if (gameState.lives <= 0) {
                            showFeedback('Game Over! Return to menu.', false);
                            setTimeout(() => location.reload(), 2500);
                        } else {
                            showFeedback('The Space Dog won this round! Back to exploring...', false);
                            exitBattle();
                        }
                    }, 1500);
                    return;
                }
            } else {
                showFeedback('Correct!', true);
            }

            // Animate dog's fact flying at player (cosmetic)
            setTimeout(() => {
                gameState.battleTurn = 'player';
                gameState.currentBattleFact = null;
            }, 1200);
        }

        // ---- SPIRAL GALAXY SPRITE ----
        function drawSpiralGalaxy(screenX, screenY, size, rotation, color, glowing, pulse) {
            ctx.save();
            ctx.translate(screenX, screenY);

            // Glowing ring for question galaxies
            if (glowing) {
                ctx.strokeStyle = '#ffdd00';
                ctx.lineWidth = 2;
                ctx.globalAlpha = 0.4 + Math.sin(pulse) * 0.3;
                ctx.beginPath();
                ctx.arc(0, 0, size + 14, 0, Math.PI * 2);
                ctx.stroke();
                ctx.globalAlpha = 1;
            }

            ctx.rotate(rotation);

            // Flattened disk (perspective tilt)
            ctx.save();
            ctx.scale(1, 0.38);
            ctx.globalAlpha = 0.2;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(0, 0, size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Two spiral arms
            for (let arm = 0; arm < 2; arm++) {
                const offset = arm * Math.PI;
                ctx.beginPath();
                for (let i = 0; i <= 44; i++) {
                    const t = i / 44;
                    const angle = offset + t * Math.PI * 2.8;
                    const r = t * size * 0.92;
                    const x = Math.cos(angle) * r;
                    const y = Math.sin(angle) * r * 0.38;
                    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                }
                ctx.strokeStyle = color;
                ctx.lineWidth = Math.max(1.5, size * 0.1);
                ctx.globalAlpha = 0.6;
                ctx.stroke();
            }

            // Inner core glow
            ctx.globalAlpha = 0.55;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(0, 0, size * 0.22, 0, Math.PI * 2);
            ctx.fill();

            // Bright nucleus
            ctx.globalAlpha = 1;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(0, 0, Math.max(2, size * 0.09), 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // ---- GALAXY LEVEL CONTENT ----
        function drawGalaxyContent() {
            drawStarfield();
            if (!gameState.galaxyData) return;

            const galaxies = gameState.galaxyData;
            const pulse = gameState.playerAnimFrame * 0.06;

            // Compute distances from player to each galaxy for vector scaling
            const distances = galaxies.map(g => {
                const dx = g.x - gameState.playerX;
                const dy = g.y - gameState.playerY;
                return Math.sqrt(dx * dx + dy * dy);
            });
            const maxDist = Math.max(...distances, 1);

            galaxies.forEach((galaxy, idx) => {
                const sx = galaxy.x - gameState.cameraX;
                const sy = galaxy.y - gameState.cameraY;
                const pad = galaxy.size + 120;
                const onScreen = sx > -pad && sx < canvas.width + pad &&
                                 sy > -pad && sy < canvas.height + pad;

                if (onScreen) {
                    const glowing = galaxy.isQuestion && !galaxy.triggered;
                    drawSpiralGalaxy(sx, sy, galaxy.size, galaxy.rotation, galaxy.color, glowing, pulse);

                    // Recession vector — points directly away from player, length proportional to distance
                    const dist = distances[idx];
                    const vectorLen = Math.pow(dist / maxDist, 0.5) * 140;
                    if (vectorLen > 3) {
                        const dx = galaxy.x - gameState.playerX;
                        const dy = galaxy.y - gameState.playerY;
                        const mag = Math.sqrt(dx * dx + dy * dy);
                        const ux = dx / mag;
                        const uy = dy / mag;

                        const startX = sx + ux * (galaxy.size * 0.5 + 6);
                        const startY = sy + uy * (galaxy.size * 0.38 * 0.5 + 6);
                        const endX = startX + ux * vectorLen;
                        const endY = startY + uy * vectorLen;

                        ctx.save();
                        ctx.strokeStyle = '#ff2200';
                        ctx.fillStyle = '#ff2200';
                        ctx.lineWidth = 2;
                        ctx.globalAlpha = 0.9;

                        ctx.beginPath();
                        ctx.moveTo(startX, startY);
                        ctx.lineTo(endX, endY);
                        ctx.stroke();

                        // Arrowhead
                        const headLen = 7;
                        const ang = Math.atan2(uy, ux);
                        ctx.beginPath();
                        ctx.moveTo(endX, endY);
                        ctx.lineTo(endX - headLen * Math.cos(ang - 0.4), endY - headLen * Math.sin(ang - 0.4));
                        ctx.lineTo(endX - headLen * Math.cos(ang + 0.4), endY - headLen * Math.sin(ang + 0.4));
                        ctx.closePath();
                        ctx.fill();

                        ctx.restore();
                    }
                } else if (galaxy.isQuestion && !galaxy.triggered) {
                    drawDirectionalArrow(galaxy.x, galaxy.y, '#ffdd00');
                }
            });

            // HUD
            const answered = galaxies.filter(g => g.isQuestion && g.triggered).length;
            const total = galaxies.filter(g => g.isQuestion).length;
            ctx.fillStyle = '#ffff99';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'left';
            ctx.fillText(`Galaxy Questions: ${answered} / ${total}`, 10, 30);

            // Draw space kitty if spawned
            if (gameState.kittySpawned && !gameState.inBattle) {
                const ksx = gameState.kittyX - gameState.cameraX;
                const ksy = gameState.kittyY - gameState.cameraY;
                const kittyOnScreen = ksx > -80 && ksx < canvas.width + 80 &&
                                      ksy > -80 && ksy < canvas.height + 80;
                if (kittyOnScreen) {
                    drawSpaceKitty(ksx, ksy, 1);
                } else {
                    drawDirectionalArrow(gameState.kittyX, gameState.kittyY, '#ff88ff');
                }
            }
        }

        // ---- START GALAXY PHASE ----

        // ---- REDSHIFT LEVEL (LEVEL 3) ----
        const REDSHIFT_TRIGGER_DIST = 20;
        const REDSHIFT_SCAN_DIST = 300;
        const ABSORPTION_LINES = [
            { nm: 393, label: 'Ca K', restFrac: 0.12 },
            { nm: 486, label: 'Hβ',   restFrac: 0.37 },

        const GALAXY_NAMES = [

        function startRedshiftPhase() {
            gameState.inRedshiftMode = true;
            gameState.playerX = 0;
            gameState.playerY = 0;

                const wx = (rng(s) - 0.5) * decorSpread * 2;
                const wy = (rng(s + 1) - 0.5) * decorSpread * 2;
                const dist = Math.sqrt(wx * wx + wy * wy);
                const z = Math.min(0.12, dist / (decorSpread * 2));
                galaxies.push({

                    y: wy,
                    size: 10 + rng(s + 2) * 16,
