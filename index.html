        function drawRedshiftContent() {
            const W = canvas.width;
            const H = canvas.height;
            const playH = Math.floor(H * 0.62);   // top: play area
            const specY = playH;                   // bottom: spectrum panel
            const specH = H - playH;

            const { galaxies, lockedGalaxy, spectrumAnim } = gameState.redshiftData;
            const pulse = gameState.playerAnimFrame * 0.06;

            // ── PLAY AREA ─────────────────────────────────────────────────
            // Clip draw to play area
            ctx.save();
            ctx.beginPath();
            ctx.rect(0, 0, W, playH);
            ctx.clip();

            drawStarfield();

            // Compute distances from player to each galaxy
            const distances = galaxies.map(g => {
                const dx = g.x - gameState.playerX;
                const dy = g.y - gameState.playerY;
                return Math.sqrt(dx * dx + dy * dy);
            });
            const maxDist = Math.max(...distances, 1);

            galaxies.forEach((galaxy, idx) => {
                const sx = galaxy.x - gameState.cameraX;
                const sy = galaxy.y - gameState.cameraY;
                const pad = galaxy.size + 120;
                if (sx < -pad || sx > W + pad || sy < -pad || sy > playH + pad) {
                    // Off-screen — draw directional arrow for question galaxies only
                    if (galaxy.isQuestion && !galaxy.triggered) {
                        drawDirectionalArrow(galaxy.x, galaxy.y, '#ffdd00');
                    }
                    return;
                }

                const glowing = galaxy.isQuestion && !galaxy.triggered;
                drawSpiralGalaxy(sx, sy, galaxy.size, galaxy.rotation, galaxy.color, glowing, pulse);

            });

            // HUD
            const answered = galaxies.filter(g => g.isQuestion && g.triggered).length;
            const total = galaxies.filter(g => g.isQuestion).length;
            ctx.fillStyle = '#ffff99';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'left';
            ctx.fillText(`Redshift Stations: ${answered} / ${total}`, 10, 22);
            ctx.fillStyle = '#aaddff';
            ctx.font = '9px Arial';
            ctx.fillText('Find glowing galaxies — watch the spectrum below shift red!', 10, 36);

            ctx.restore(); // end clip

            // Divider
            ctx.fillStyle = '#1a1a2a';
            ctx.fillRect(0, playH, W, 4);

            // ── SPECTRUM PANEL ────────────────────────────────────────────
            ctx.fillStyle = '#06000e';
            ctx.fillRect(0, specY + 4, W, specH - 4);

            // Find galaxy to display in spectrum
            let displayGalaxy = lockedGalaxy;
            if (!displayGalaxy) {
                // Find nearest within REDSHIFT_SCAN_DIST
                let nearestDist = Infinity;
                galaxies.forEach((g, i) => {
                    if (distances[i] < REDSHIFT_SCAN_DIST && distances[i] < nearestDist) {
                        nearestDist = distances[i];
                        displayGalaxy = g;
                    }
                });
            }

            const stripW = Math.min(W - 120, 560);
            const stripX = Math.floor((W - stripW) / 2);
            const stripY = specY + 28;
            const stripH = 30;

            // Title
            ctx.fillStyle = '#88ccff';
            ctx.font = 'bold 10px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('SPECTROGRAPH — GALAXY LIGHT ANALYSIS', W / 2, specY + 14);
            ctx.textAlign = 'left';

            // Rainbow strip
            const grad = ctx.createLinearGradient(stripX, 0, stripX + stripW, 0);
            grad.addColorStop(0,    '#7b00ff'); // violet
            grad.addColorStop(0.15, '#4400ff'); // blue-violet
            grad.addColorStop(0.30, '#0088ff'); // blue
            grad.addColorStop(0.48, '#00cc44'); // green
            grad.addColorStop(0.62, '#eeee00'); // yellow
            grad.addColorStop(0.78, '#ff6600'); // orange
            grad.addColorStop(1.0,  '#cc0000'); // red
            ctx.fillStyle = grad;
            ctx.fillRect(stripX, stripY, stripW, stripH);
            ctx.strokeStyle = '#334';
            ctx.lineWidth = 1;
            ctx.strokeRect(stripX, stripY, stripW, stripH);

            // Compute z for display
            const displayZ = displayGalaxy ? (lockedGalaxy ? displayGalaxy.z * Math.min(1, spectrumAnim * 1.4) : displayGalaxy.z) : 0;
            const shiftPixels = displayZ * stripW * 2.2; // max shift across the strip

            // Draw absorption lines
            ABSORPTION_LINES.forEach(line => {
                const restX = stripX + line.restFrac * stripW;
                const shiftedX = restX + shiftPixels;

                // Rest position (gray dashed)
                ctx.strokeStyle = 'rgba(180,180,200,0.35)';
                ctx.lineWidth = 1;
                ctx.setLineDash([2, 3]);
                ctx.beginPath();
                ctx.moveTo(restX, stripY - 4);
                ctx.lineTo(restX, stripY + stripH + 4);
                ctx.stroke();
                ctx.setLineDash([]);

                // Shifted line (dark, thick)
                if (shiftedX <= stripX + stripW + 2) {
                    ctx.strokeStyle = 'rgba(0,0,0,0.92)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(shiftedX, stripY);
                    ctx.lineTo(shiftedX, stripY + stripH);
                    ctx.stroke();

                    // Label
                    ctx.fillStyle = displayZ > 0.005 ? '#ff9966' : '#aaaaaa';
                    ctx.font = '8px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(line.label, shiftedX, stripY + stripH + 10);
                }
            });
            ctx.textAlign = 'left';

            // Wavelength axis labels
            ctx.fillStyle = '#445566';
            ctx.font = '7px Arial';
            ctx.fillText('400 nm', stripX, stripY + stripH + 22);
            ctx.textAlign = 'right';
            ctx.fillText('700 nm', stripX + stripW, stripY + stripH + 22);
            ctx.textAlign = 'left';

            // z and galaxy info
            if (displayGalaxy) {
                ctx.fillStyle = '#ffff44';
                ctx.font = 'bold 11px Arial';
                ctx.fillText(`z = ${displayZ.toFixed(4)}`, stripX, specY + 14);
                ctx.fillStyle = '#aaddff';
                ctx.font = '9px Arial';
                ctx.fillText(displayGalaxy.name, stripX + stripW - 50, specY + 14);

                const speedFrac = displayZ / 0.12;
                const barW = Math.floor(speedFrac * 120);
                ctx.fillStyle = '#220000';
                ctx.fillRect(W - 140, stripY + 4, 120, 10);
                ctx.fillStyle = `rgb(${Math.floor(80 + 175 * speedFrac)},${Math.floor(60 * (1 - speedFrac))},0)`;
                ctx.fillRect(W - 140, stripY + 4, barW, 10);
                ctx.strokeStyle = '#554';
                ctx.lineWidth = 1;
                ctx.strokeRect(W - 140, stripY + 4, 120, 10);
                ctx.fillStyle = '#aaa';
                ctx.font = '7px Arial';
                ctx.fillText('recession →', W - 140, stripY + 22);
            } else {
                ctx.fillStyle = '#445566';
                ctx.font = 'bold 10px Arial';
                ctx.fillText('No signal — approach a galaxy', stripX, specY + 14);
            }

            // Legend
            ctx.fillStyle = 'rgba(180,180,200,0.35)';
            ctx.fillRect(W - 28, stripY + 34, 10, 14);
            ctx.fillStyle = '#666';
            ctx.font = '7px Arial';
            ctx.fillText('rest pos.', W - 18, stripY + 44);
        }

        function drawLevelContent() {
            // Draw extended platform
            ctx.fillStyle = '#8b4513';
            const platformY = canvas.height * 0.75;
            const platformHeight = 40;

            // Draw platform sections (extended beyond camera view)
            const startX = Math.max(0, gameState.cameraX - 200);
            const endX = gameState.cameraX + canvas.width + 200;
            ctx.fillRect(startX - gameState.cameraX, platformY, endX - startX, platformHeight);

            // Draw trees along the level
            const treeSpacing = 400;
            for (let i = 0; i < LEVEL_WIDTH; i += treeSpacing) {
                const screenX = i - gameState.cameraX;
                drawTree(i, screenX, 60);
            }

            // Draw some additional trees for variety
            for (let i = 200; i < LEVEL_WIDTH; i += treeSpacing * 1.5) {
                const screenX = i - gameState.cameraX;
                drawTree(i, screenX, 50);
            }

            // Draw enemies for each question
            flags.forEach((enemy, index) => {
                // Only draw if not answered yet, or if currently falling/fading
                if (!enemy.answered || enemy.isFalling || enemy.opacity > 0) {
                    const screenX = enemy.x - gameState.cameraX;
                    const screenY = enemy.y;
                    drawEnemy(screenX, screenY, enemy.answered, index, enemy.isFalling, enemy.rotation, enemy.opacity);
                }
            });

            // Draw distance markers
            ctx.fillStyle = '#666666';
            ctx.font = '9px Arial';
            for (let i = 0; i < LEVEL_WIDTH; i += 500) {
                const screenX = i - gameState.cameraX;
                if (screenX > 0 && screenX < canvas.width) {
                    ctx.fillRect(screenX, canvas.height * 0.73, 1, 2);
                }
            }

            // Draw decorative elements based on level
            ctx.fillStyle = '#ffff00';
            ctx.font = 'bold 14px Arial';

            const levelMessages = {
                1: "DEFINITIONS",
                2: "FACTS",
                3: "REDSHIFT",
                4: "GALAXY MOVEMENT"
            };

            ctx.fillText(levelMessages[gameState.currentLevel], canvas.width / 2 - 80, 30);

            // Draw world position indicator
            ctx.fillStyle = '#000000';
            ctx.font = '10px Arial';
            ctx.fillText(`Distance: ${Math.round(gameState.playerX / 10)}`, canvas.width - 120, 20);

            // Progress indicator
            const progressWidth = (gameState.levelProgress / 100) * (canvas.width - 40);
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(20, 50, progressWidth, 15);
            ctx.strokeStyle = '#000000';
            ctx.strokeRect(20, 50, canvas.width - 40, 15);
        }


        function updateGame() {
            // Update animation frame always
            gameState.playerAnimFrame++;

            // Celebration mode - only animate, no game logic
            if (gameState.inCelebration) {
                resizeCanvas();
                drawGame();
                return;
            }

            // Battle mode - only draw, no movement
            if (gameState.inBattle) {
                resizeCanvas();
                drawGame();
                return;
            }

            // Update player position based on input
            gameState.playerVelX = 0;
            gameState.playerVelY = 0;

            if (gameState.inExploration) {
                // In exploration mode, allow free movement in all directions
                if (keyPressed['w'] || keyPressed['arrowup']) {
                    gameState.playerVelY = -PLAYER_SPEED;
                }
                if (keyPressed['s'] || keyPressed['arrowdown']) {
                    gameState.playerVelY = PLAYER_SPEED;
                }
                if (keyPressed['a'] || keyPressed['arrowleft']) {
                    gameState.playerVelX = -PLAYER_SPEED;
                    gameState.playerDirection = -1;
                }
                if (keyPressed['d'] || keyPressed['arrowright']) {
                    gameState.playerVelX = PLAYER_SPEED;
                    gameState.playerDirection = 1;
                }

                // Track movement direction for spawning papers
                if (gameState.playerVelX !== 0 || gameState.playerVelY !== 0) {
                    gameState.lastMovementAngle = Math.atan2(gameState.playerVelY, gameState.playerVelX);
                }

                // Apply velocity
                gameState.playerX += gameState.playerVelX;
                gameState.playerY += gameState.playerVelY;

                // Unlimited movement in exploration mode

                // Update camera to follow player and keep them centered (unlimited movement)
                gameState.cameraX = gameState.playerX - canvas.width / 2;
                gameState.cameraY = gameState.playerY - canvas.height / 2;

                // Check if player found the paper
                if (!gameState.paperFound) {
                    const paperDist = Math.sqrt(
                        Math.pow(gameState.playerX - gameState.factPaperX, 2) +
                        Math.pow(gameState.playerY - gameState.factPaperY, 2)
                    );
                    if (paperDist < 50) {
                        gameState.paperFound = true;
                        showFactModal();
                    }
                }

                // Check if player found the fact dude
                if (gameState.paperFound && !gameState.factDudeFound) {
                    const dudeDist = Math.sqrt(
                        Math.pow(gameState.playerX - gameState.factDudeX, 2) +
                        Math.pow(gameState.playerY - gameState.factDudeY, 2)
                    );
                    if (dudeDist < 50) {
                        gameState.factDudeFound = true;
                        showFactQuestion();
                    }
                }

                // Randomly spawn space dog if not yet spawned
                if (!gameState.dogSpawned) {
                    const distFromStart = Math.sqrt(gameState.playerX * gameState.playerX + gameState.playerY * gameState.playerY);
                    if (distFromStart > 400 && Math.random() < 0.002) {
                        const dogAngle = Math.random() * Math.PI * 2;
                        gameState.dogX = gameState.playerX + Math.cos(dogAngle) * (300 + Math.random() * 200);
                        gameState.dogY = gameState.playerY + Math.sin(dogAngle) * (300 + Math.random() * 200);
                        gameState.dogSpawned = true;
                    }
                }

                // Move dog toward player and check encounter
                if (gameState.dogSpawned && !gameState.inBattle && !factModalOpen) {
                    const dogDx = gameState.playerX - gameState.dogX;
                    const dogDy = gameState.playerY - gameState.dogY;
                    const dogDist = Math.sqrt(dogDx * dogDx + dogDy * dogDy);
                    if (dogDist < 60) {
                        enterBattle();
                    } else {
                        const dogSpeed = 1.2;
                        gameState.dogX += (dogDx / dogDist) * dogSpeed;
                        gameState.dogY += (dogDy / dogDist) * dogSpeed;
                    }
                }
            } else if (gameState.inGalaxyMode) {
                // Galaxy mode — same free movement as exploration
                if (keyPressed['w'] || keyPressed['arrowup']) gameState.playerVelY = -PLAYER_SPEED;
                if (keyPressed['s'] || keyPressed['arrowdown']) gameState.playerVelY = PLAYER_SPEED;
                if (keyPressed['a'] || keyPressed['arrowleft']) { gameState.playerVelX = -PLAYER_SPEED; gameState.playerDirection = -1; }
                if (keyPressed['d'] || keyPressed['arrowright']) { gameState.playerVelX = PLAYER_SPEED; gameState.playerDirection = 1; }

                if (gameState.playerVelX !== 0 || gameState.playerVelY !== 0) {
                    gameState.lastMovementAngle = Math.atan2(gameState.playerVelY, gameState.playerVelX);
                }

                gameState.playerX += gameState.playerVelX;
                gameState.playerY += gameState.playerVelY;
                gameState.cameraX = gameState.playerX - canvas.width / 2;
                gameState.cameraY = gameState.playerY - canvas.height / 2;

                // Check proximity to question galaxies
                if (gameState.galaxyData && !questionModalOpen) {
                    gameState.galaxyData.forEach(galaxy => {
                        if (galaxy.isQuestion && !galaxy.triggered) {
                            const dx = gameState.playerX - galaxy.x;
                            const dy = gameState.playerY - galaxy.y;
                            if (Math.sqrt(dx * dx + dy * dy) < 20) {
                                galaxy.triggered = true;
                                currentQuestionIndex = galaxy.questionIndex;
                                showQuestion();
                            }
                        }
                    });
                }

                // Randomly spawn space kitty
                if (!gameState.kittySpawned) {
                    const distFromStart = Math.sqrt(gameState.playerX * gameState.playerX + gameState.playerY * gameState.playerY);
                    if (distFromStart > 400 && Math.random() < 0.002) {
                        const kittyAngle = Math.random() * Math.PI * 2;
                        gameState.kittyX = gameState.playerX + Math.cos(kittyAngle) * (300 + Math.random() * 200);
                        gameState.kittyY = gameState.playerY + Math.sin(kittyAngle) * (300 + Math.random() * 200);
                        gameState.kittySpawned = true;
                    }
                }

                // Move kitty toward player and check encounter
                if (gameState.kittySpawned && !gameState.inBattle) {
                    const kDx = gameState.playerX - gameState.kittyX;
                    const kDy = gameState.playerY - gameState.kittyY;
                    const kDist = Math.sqrt(kDx * kDx + kDy * kDy);
                    if (kDist < 60) {
                        enterBattle('kitty');
                    } else {
                        const kittySpeed = 1.4;
                        gameState.kittyX += (kDx / kDist) * kittySpeed;
                        gameState.kittyY += (kDy / kDist) * kittySpeed;
                    }
                }
            } else if (gameState.inRedshiftMode) {
                // Redshift mode — free movement, spectrum panel below
                if (keyPressed['w'] || keyPressed['arrowup']) gameState.playerVelY = -PLAYER_SPEED;
                if (keyPressed['s'] || keyPressed['arrowdown']) gameState.playerVelY = PLAYER_SPEED;
                if (keyPressed['a'] || keyPressed['arrowleft']) { gameState.playerVelX = -PLAYER_SPEED; gameState.playerDirection = -1; }
                if (keyPressed['d'] || keyPressed['arrowright']) { gameState.playerVelX = PLAYER_SPEED; gameState.playerDirection = 1; }

                if (gameState.playerVelX !== 0 || gameState.playerVelY !== 0) {
                    gameState.lastMovementAngle = Math.atan2(gameState.playerVelY, gameState.playerVelX);
                }

                gameState.playerX += gameState.playerVelX;
                gameState.playerY += gameState.playerVelY;
                gameState.cameraX = gameState.playerX - canvas.width / 2;
                gameState.cameraY = gameState.playerY - canvas.height / 2;

                // Check proximity to question galaxies
                if (gameState.redshiftData && !questionModalOpen) {
                    gameState.redshiftData.galaxies.forEach(galaxy => {
                        if (galaxy.isQuestion && !galaxy.triggered) {
                            const dx = gameState.playerX - galaxy.x;
                            const dy = gameState.playerY - galaxy.y;
                            if (Math.sqrt(dx * dx + dy * dy) < REDSHIFT_TRIGGER_DIST) {
                                galaxy.triggered = true;
                                gameState.redshiftData.lockedGalaxy = galaxy;
                                gameState.redshiftData.spectrumAnim = 0;
                                currentQuestionIndex = galaxy.questionIndex;
                                setTimeout(() => showQuestion(), 1500);
                            }
                        }
                    });
                    // Animate spectrumAnim toward 1
                    if (gameState.redshiftData.lockedGalaxy && gameState.redshiftData.spectrumAnim < 1) {
                        gameState.redshiftData.spectrumAnim = Math.min(1, gameState.redshiftData.spectrumAnim + 0.012);
                    }
                }
            } else {
                // Normal level mode - horizontal movement only
                if (keyPressed['a'] || keyPressed['arrowleft']) {
                    gameState.playerVelX = -PLAYER_SPEED;
                    gameState.playerDirection = -1;
                }
                if (keyPressed['d'] || keyPressed['arrowright']) {
                    gameState.playerVelX = PLAYER_SPEED;
                    gameState.playerDirection = 1;
                }

                // Apply velocity
                gameState.playerX += gameState.playerVelX;

                // Clamp player position to level bounds
                gameState.playerX = Math.max(0, Math.min(gameState.playerX, LEVEL_WIDTH - PLAYER_WIDTH));

                // Update player Y position (on platform)
                gameState.playerY = canvas.height * 0.65;
                // Keep flag Y in sync so resizing doesn't strand dudes in the air
                flags.forEach(f => { if (!f.isFalling && !f.hasHit) f.y = gameState.playerY; });
                // Update camera to follow player (keep player roughly centered) - normal mode only
                const targetCameraX = gameState.playerX - SCREEN_WIDTH_UNITS / 3;
                gameState.cameraX = Math.max(0, Math.min(targetCameraX, LEVEL_WIDTH - SCREEN_WIDTH_UNITS));
            }



            // Update falling enemies (normal gameplay only)
            if (!gameState.inExploration) {
                flags.forEach((flag) => {
                    if (flag.isFalling) {
                        flag.fallVelocity += 0.5; // gravity
                        flag.y += flag.fallVelocity;
                        flag.rotation += flag.rotationSpeed; // Update rotation

                        // Check if enemy hit the player
                        const playerCenterX = gameState.playerX + PLAYER_WIDTH / 2;
                        const playerCenterY = gameState.playerY;

                        const distance = Math.sqrt(
                            Math.pow(playerCenterX - flag.x, 2) +
                            Math.pow(playerCenterY - flag.y, 2)
                        );

                        if (distance < 50 && flag.fallVelocity > 0) {
                            flag.isFalling = false;
                            flag.hasHit = true;
                            flag.y = gameState.playerY + 60; // Rest below player
                            flag.hitTime = gameState.playerAnimFrame;
                        }

                        // Stop falling if hit ground
                        if (flag.y >= canvas.height * 0.65) {
                            flag.isFalling = false;
                            flag.hasHit = true;
                            flag.y = canvas.height * 0.65;
                            flag.hitTime = gameState.playerAnimFrame;
                        }
                    }

                    // Fade out after hitting
                    if (flag.hitTime !== null) {
                        const fadeFrames = 60; // Fade over 1 second (60 frames)
                        const framesSinceHit = gameState.playerAnimFrame - flag.hitTime;
                        flag.opacity = Math.max(0, 1 - (framesSinceHit / fadeFrames));
                    }
                });
            }

            // Check collision with flags (normal gameplay only)
            if (!gameState.inExploration) {
                flags.forEach((flag) => {
                    if (!flag.answered && !flag.isFalling) {
                        const distance = Math.sqrt(
                            Math.pow(gameState.playerX + PLAYER_WIDTH / 2 - flag.x, 2) +
                            Math.pow(gameState.playerY - flag.y, 2)
                        );

                        if (distance < 50 && !flag.triggered) {
                            flag.triggered = true;
                            currentQuestionIndex = flag.questionIndex;
                            showQuestion();
                        }
                    }
                });
            }

            // Calculate progress
            gameState.levelProgress = (gameState.questionsAnswered / levels[gameState.currentLevel].questions.length) * 100;

            resizeCanvas();
            drawGame();
        }

        function submitAnswer() {
            const selected = document.querySelector('input[name="answer"]:checked');

            if (!selected) {
                showFeedback('Please select an answer', false);
                return;
            }

            const answer = parseInt(selected.value);
            const isFactQuestion = gameState.inExploration;
            let isCorrect = answer === currentQuestion.correct;

            if (!isFactQuestion) {
                // Mark the flag as answered for regular questions
                if (currentQuestionIndex < flags.length) {
                    flags[currentQuestionIndex].answered = true;
                }
            }

            if (isCorrect) {
                gameState.score += 100;
                gameState.questionsCorrect++;
                showFeedback('✓ Correct!', true);
            } else {
                showFeedback('✗ Incorrect. Answer: ' + currentQuestion.options[currentQuestion.correct], false);

                if (isFactQuestion) {
                    // Fact question - lose a life then fade and respawn
                    gameState.lives--;

                    let fadeInterval = setInterval(() => {
                        gameState.explorationOpacity = Math.max(0, gameState.explorationOpacity - 0.05);
                        if (gameState.explorationOpacity <= 0) {
                            clearInterval(fadeInterval);
                            // Respawn in the direction the player is moving
                            const angle = gameState.lastMovementAngle;
                            gameState.factPaperX = gameState.playerX + Math.cos(angle) * 800;
                            gameState.factPaperY = gameState.playerY + Math.sin(angle) * 800;
                            gameState.factDudeX = gameState.playerX + Math.cos(angle) * 1500;
                            gameState.factDudeY = gameState.playerY + Math.sin(angle) * 1500;
                            gameState.factDudeFound = false;
                            gameState.paperFound = false;
                            gameState.explorationOpacity = 1;
                            console.log("respawned after wrong answer");
                        }
                    }, 50);
                } else {
                    // Regular question - trigger falling damage
                    gameState.lives--;

                    // Trigger falling damage animation on the enemy
                    if (currentQuestionIndex < flags.length) {
                        const enemy = flags[currentQuestionIndex];
                        enemy.isFalling = true;
                        enemy.y = enemy.y - 40; // Start from current drawn position
                        enemy.fallVelocity = 0;
                        enemy.rotation = 0;
                        enemy.rotationSpeed = (Math.random() - 0.5) * 0.3; // Random spin rate
                    }
                }

                if (gameState.lives <= 0) {
                    closeModal();
                    setTimeout(() => {
                        showFeedback('Game Over! Return to menu.', false);
                        setTimeout(() => location.reload(), 2500);
                    }, 500);
                    return;
                }
            }

            gameState.questionsAnswered++;

            // Close modal immediately so user can watch the falling enemy
            closeModal();
            updateGame();

            // If fact question was answered
            if (isFactQuestion) {
                if (isCorrect) {
                    gameState.factsAnswered = (gameState.factsAnswered || 0) + 1;
                    // After 3 facts, advance to next level
                    if (gameState.factsAnswered >= 6) {
                        setTimeout(() => {
                            gameState.inExploration = false;
                            nextLevel();
                        }, 2500);
                    } else {
                        // Spawn next fact
                        setTimeout(() => {
                            spawnNextFact();
                            updateGame();
                        }, 2500);
                    }
                }
            } else {
                // Regular level questions - check if level is complete after feedback delay
                setTimeout(() => {
                    if (gameState.questionsAnswered >= levels[gameState.currentLevel].questions.length) {
                        completeLevelModal();
                    }
                }, 2500);
            }
        }

        function drawCelebration() {
            const W = canvas.width;
            const H = canvas.height;
            const f = gameState.celebrationFrame++;
            const phase = gameState.celebrationPhase;

            // Background — deep space gradient
            const bg = ctx.createLinearGradient(0, 0, 0, H);
            bg.addColorStop(0, '#000011');
            bg.addColorStop(1, '#0a0030');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, W, H);

            drawStarfield();

            // Disco ground strip
            const groundY = H * 0.78;
            for (let gx = 0; gx < W; gx += 30) {
                const hue = (gx / W * 360 + f * 2) % 360;
                ctx.fillStyle = `hsl(${hue},80%,35%)`;
                ctx.fillRect(gx, groundY, 30, H - groundY);
            }
            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();

            // Floating stars / sparkles
            for (let i = 0; i < 18; i++) {
                const sx = ((i * 137 + f * (i % 3 === 0 ? 0.8 : 1.3)) % W + W) % W;
                const sy = ((i * 79 + f * 0.5) % (groundY * 0.9));
                const r = 2 + Math.sin(f * 0.07 + i) * 1.5;
                const hue = (f * 3 + i * 20) % 360;
                ctx.fillStyle = `hsl(${hue},100%,75%)`;
                ctx.beginPath();
                ctx.arc(sx, sy, r, 0, Math.PI * 2);
                ctx.fill();
            }

            // Draw space dogs
            gameState.celebrationDogs.forEach(d => {
                const x = d.xFrac * W;
                const bob = Math.sin(f * 0.09 + d.phase) * 14;
                const lean = Math.sin(f * 0.09 + d.phase) * 0.15;
                ctx.save();
                ctx.translate(x, d.yFrac * H + bob);
                ctx.rotate(lean);
                ctx.translate(-x, -(d.yFrac * H + bob));
                drawSpaceDog(x, d.yFrac * H + bob, 1);
                ctx.restore();
            });

            // Draw space kitties
            gameState.celebrationKitties.forEach(d => {
                const x = d.xFrac * W;
                const bob = Math.sin(f * 0.11 + d.phase) * 16;
                const lean = Math.sin(f * 0.11 + d.phase) * 0.18;
                ctx.save();
                ctx.translate(x, d.yFrac * H + bob);
                ctx.rotate(lean);
                ctx.translate(-x, -(d.yFrac * H + bob));
                drawSpaceKitty(x, d.yFrac * H + bob, 1);
                ctx.restore();
            });

            // Draw goofy dudes (with scale for phase 1)
            gameState.celebrationDudes.forEach((d, i) => {
                if (phase === 1) d.scale = Math.min(4, d.scale + 0.004);
                const x = d.xFrac * W;
                const bob = Math.sin(f * 0.1 + d.phase) * 18;
                const y = d.yFrac * H + bob;
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(d.scale, d.scale);
                ctx.translate(-x, -y);
                // draw body parts manually using the dude palette
                const bodyColor = d.color;
                ctx.fillStyle = bodyColor;
                ctx.fillRect(x - 12, y - 30, 24, 35);
                ctx.beginPath(); ctx.arc(x, y - 35, 10, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.beginPath(); ctx.arc(x - 4, y - 37, 3, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(x + 5, y - 36, 3.5, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#000000';
                ctx.beginPath(); ctx.arc(x - 3, y - 38, 1.5, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(x + 6, y - 35, 1.5, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(x-3,y-32); ctx.quadraticCurveTo(x,y-29,x+3,y-32); ctx.stroke();
                ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(x-12,y-15); ctx.lineTo(x-25,y-10); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x+12,y-15); ctx.lineTo(x+28,y-5); ctx.stroke();
                ctx.fillStyle = bodyColor;
                for (let s = 0; s < 5; s++) {
                    const ang = (s / 5) * Math.PI;
                    ctx.beginPath();
                    ctx.moveTo(x + Math.cos(ang)*10, y - 45 + Math.sin(ang)*5);
                    ctx.lineTo(x + Math.cos(ang)*16, y - 52 + Math.sin(ang)*5);
                    ctx.lineTo(x + Math.cos(ang+0.3)*12, y - 49 + Math.sin(ang)*5);
                    ctx.closePath(); ctx.fill();
                }
                ctx.restore();
            });

            // ── CONGRATS TEXT (phase 1 only) ──────────────────────────
            if (phase === 1) {
                const cx = W / 2;
                const ty = H * 0.30;

                // Glow halo
                const glow = ctx.createRadialGradient(cx, ty, 10, cx, ty, 200);
                glow.addColorStop(0, 'rgba(100,80,255,0.35)');
                glow.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = glow;
                ctx.fillRect(cx - 220, ty - 80, 440, 160);

                // Shadow
                ctx.shadowColor = '#7700ff';
                ctx.shadowBlur = 28;

                // "Congrats." line
                const hue1 = (f * 1.5) % 360;
                const grad1 = ctx.createLinearGradient(cx - 180, 0, cx + 180, 0);
                grad1.addColorStop(0, `hsl(${hue1},100%,70%)`);
                grad1.addColorStop(0.5, `hsl(${(hue1+120)%360},100%,85%)`);
                grad1.addColorStop(1, `hsl(${(hue1+240)%360},100%,70%)`);
                ctx.fillStyle = grad1;
                ctx.font = `bold ${Math.round(W * 0.065)}px Georgia, serif`;
                ctx.textAlign = 'center';
                ctx.fillText('Congrats,', cx, ty - 10);

                // Name line
                const grad2 = ctx.createLinearGradient(cx - 150, 0, cx + 150, 0);
                grad2.addColorStop(0, `hsl(${(hue1+60)%360},100%,75%)`);
                grad2.addColorStop(1, `hsl(${(hue1+180)%360},100%,75%)`);
                ctx.fillStyle = grad2;
                ctx.font = `bold ${Math.round(W * 0.048)}px Georgia, serif`;
                ctx.fillText(gameState.celebrationName + '!', cx, ty + Math.round(W * 0.065) - 2);

                // Subtitle
                ctx.shadowBlur = 14;
                ctx.shadowColor = '#00ccff';
                ctx.fillStyle = '#e0f8ff';
                ctx.font = `italic ${Math.round(W * 0.030)}px Georgia, serif`;
                ctx.fillText('You know the Big Bang!', cx, ty + Math.round(W * 0.065) + Math.round(W * 0.042));

                ctx.shadowBlur = 0;
                ctx.textAlign = 'left';
            }
        }

        function nextLevel() {
            closeLevelModal();
            gameState.inExploration = false;
            gameState.inGalaxyMode = false;
            gameState.inRedshiftMode = false;

            if (gameState.currentLevel < 4) {
                gameState.currentLevel++;
                currentQuestionIndex = 0;
                gameState.questionsAnswered = 0;
                gameState.questionsCorrect = 0;
                gameState.levelProgress = 0;

                updateDisplay();
                updateSidebar();

                if (gameState.currentLevel === 2) {
                    startExplorationPhase();
                } else if (gameState.currentLevel === 3) {
                    startRedshiftPhase();
                } else if (gameState.currentLevel === 4) {
                    startGalaxyPhase();
                } else {
                    setupLevel();
                    updateGame();
                }
            } else {
                startCelebration();
            }
        }

        function updateDisplay() {
            document.getElementById('levelDisplay').textContent = gameState.currentLevel;
            document.getElementById('scoreDisplay').textContent = gameState.score;
            document.getElementById('livesDisplay').textContent = gameState.lives;
            document.getElementById('progressDisplay').textContent = Math.round(gameState.levelProgress) + '%';
        }

        function setupLevel() {
            // Create flags for each question in the level, spread across the extended world
            flags = [];
            currentFlagIndex = 0;
            const numQuestions = levels[gameState.currentLevel].questions.length;
            const spacing = LEVEL_WIDTH / (numQuestions + 1);

            for (let i = 0; i < numQuestions; i++) {
                flags.push({
                    x: spacing * (i + 1),
                    y: canvas.height * 0.65,
                    questionIndex: i,
                    triggered: false,
                    answered: false,
                    isFalling: false,
                    hasHit: false,
                    fallStartY: 0,
                    fallVelocity: 0,
                    rotation: 0,
                    rotationSpeed: 0,
                    hitTime: null,
                    opacity: 1
                });
            }

            gameState.playerX = 100;
            gameState.playerY = canvas.height * 0.65;
            gameState.cameraX = 0;
            gameState.playerAnimFrame = 0;
        }

        // Keyboard handlers
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();

            // Celebration mode — only Y/N are active; everything else is blocked
            if (gameState.inCelebration) {
                if (gameState.celebrationPhase === 1) {
                    if (key === 'y') { location.reload(); }
                    if (key === 'n') { document.getElementById('celebrationRestart').style.display = 'none'; }
                }
                return;
            }

            // Battle mode controls
            if (gameState.inBattle) {
                if (key === ' ') {
                    e.preventDefault();
                    playerBattleAttack();
                } else if (key === 't') {
                    e.preventDefault();
                    resolveDogAttack(true);
                } else if (key === 'f' && gameState.inBattle) {
                    e.preventDefault();
                    resolveDogAttack(false);
                }
                return;
            }

            // Debug: Press C to complete current level
            if (key === 'c') {
                e.preventDefault();
                if (gameState.inExploration || gameState.inGalaxyMode || gameState.inRedshiftMode) {
                    gameState.inExploration = false;
                    gameState.inGalaxyMode = false;
                    gameState.inRedshiftMode = false;
                    nextLevel();
                } else {
                    gameState.questionsAnswered = levels[gameState.currentLevel].questions.length;
                    gameState.questionsCorrect = levels[gameState.currentLevel].questions.length;
                    completeLevelModal();
                }
                return;
            }

            // Handle question modal controls
            if (questionModalOpen) {
                if (key === 'arrowup' || key === 'w') {
                    e.preventDefault();
                    selectPreviousOption();
                } else if (key === 'arrowdown' || key === 's') {
                    e.preventDefault();
                    selectNextOption();
                } else if (key === 'arrowleft' || key === 'arrowright') {
                    e.preventDefault();
                } else if (key === 'enter') {
                    e.preventDefault();
                    submitAnswer();
                }
                return;
            }

            // Handle F key for FAX (fact display) in exploration
            if (key === 'f' && gameState.inExploration && gameState.paperFound) {
                e.preventDefault();
                if (!factModalOpen) {
                    showFactModal();
                } else {
                    closeFactModal();
                }
                return;
            }

            // Close fact modal with Enter only
            if (key === 'enter' && factModalOpen) {
                closeFactModal();
                e.preventDefault();
                return;
            }

            // Handle movement controls
            if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(key)) {
                if (factModalOpen) {
                    e.preventDefault();
                    return;
                }
                keyPressed[key] = true;
                if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(key)) {
                    ensureMusicPlaying();
                }
                e.preventDefault();
            }
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(key)) {
                keyPressed[key] = false;
            }
        });

        function selectNextOption() {
            const options = document.querySelectorAll('input[name="answer"]');
            let currentIndex = -1;

            options.forEach((option, index) => {
                if (option.checked) currentIndex = index;
            });

            const nextIndex = (currentIndex + 1) % options.length;
            options[nextIndex].checked = true;
            options[nextIndex].focus();
        }

        function selectPreviousOption() {
            const options = document.querySelectorAll('input[name="answer"]');
            let currentIndex = 0;

            options.forEach((option, index) => {
                if (option.checked) currentIndex = index;
            });

            const prevIndex = currentIndex === 0 ? options.length - 1 : currentIndex - 1;
            options[prevIndex].checked = true;
            options[prevIndex].focus();
        }

        // Update sidebar to show locked/unlocked levels
        function updateSidebar() {
            document.querySelectorAll('.level-item').forEach(item => {
                const level = parseInt(item.dataset.level);
                item.classList.remove('active', 'locked');

                if (level === gameState.currentLevel) {
                    item.classList.add('active');
                } else if (level > gameState.currentLevel) {
                    item.classList.add('locked');
                }
            });
        }

        // Sidebar level selection - disabled for linear progression
        document.querySelectorAll('.level-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                // Linear progression - no manual level selection
            });
        });

        // Initial setup
        resizeCanvas();
        updateSidebar();
        setupLevel();
        updateGame();

        // Game loop
        setInterval(() => {
            updateGame();
        }, 1000 / 60); // 60 FPS

        window.addEventListener('resize', () => {
            resizeCanvas();
            updateGame();
        });
    </script>
</body>
</html>
